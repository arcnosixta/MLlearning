name: Verify course
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: node --check app.js && node --check lab.js
      - run: python scripts/build.py
      - run: python courses/verify.py
      - run: python tests/verify_file_path.py
      - run: python tests/verify_tracks.py
      - run: python tests/verify_teaching.py
      - run: python tests/verify_java.py
      - run: python tests/verify_java_full.py
      - run: python tests/verify_sysadmin_full.py
      - name: Verify JDBC and Maven Java laboratory
        run: |
          python -c "import urllib.request,hashlib,pathlib; p=pathlib.Path('artifacts/h2.jar'); p.parent.mkdir(exist_ok=True); data=urllib.request.urlopen('https://repo.maven.apache.org/maven2/com/h2database/h2/2.3.232/h2-2.3.232.jar').read(); assert hashlib.sha256(data).hexdigest() == '8dae62d22db8982c3dcb3826edb9c727c5d302063a67eef7d63d82de401f07d3'; p.write_bytes(data)"
          python tests/verify_java_jdbc.py artifacts/h2.jar
          python -m zipfile -e dist/java-full/25/lab.zip artifacts/java-maven-lab
          mvn -B -f artifacts/java-maven-lab/pom.xml test
      - run: node tests/java_core_check.js
      - run: node tests/track_core_check.js
      - run: python tests/verify_course.py
      - run: python tests/verify_locales.py
      - name: Verify browser interactions
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c "import urllib.request,time; time.sleep(1); assert urllib.request.urlopen('http://127.0.0.1:8765').status == 200"
          python tests/browser_check.py
          python tests/browser_locale.py
          python tests/browser_storage.py
          python tests/browser_file_path.py
          python tests/browser_java.py
          python tests/browser_java_full.py
          python tests/browser_sysadmin_full.py
          python tests/browser_tracks.py
          python tests/browser_teaching.py
          python tests/browser_studio.py
          python tests/browser_motion.py
          python tests/browser_ticks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/*.png
